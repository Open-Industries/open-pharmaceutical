asyncapi: 2.6.0
info:
  title: Open Pharmaceutical — Reference Pharmaceutical Core Platform — Domain Events
  version: 1.0.0
  description: >
    CloudEvents 1.0 envelopes published by the platform's bounded contexts.
    Consumers MUST be idempotent and tolerate unknown fields. Ordering is
    guaranteed only per aggregate (the CloudEvent `subject`).
servers:
  production:
    url: kafka://broker.pharma.svc.cluster.local:9092
    protocol: kafka
    description: Kafka-backed Knative Broker in production; Knative Broker abstraction elsewhere.
channels:
  product.created:
    publish:
      operationId: on-product-created
      message: { $ref: '#/components/messages/Generic' }
  batch.created:
    publish:
      operationId: on-batch-created
      message: { $ref: '#/components/messages/Generic' }
  disposition.created:
    publish:
      operationId: on-disposition-created
      message: { $ref: '#/components/messages/Generic' }
  serialpkg.created:
    publish:
      operationId: on-serialpkg-created
      message: { $ref: '#/components/messages/Generic' }
  notification.created:
    publish:
      operationId: on-notification-created
      message: { $ref: '#/components/messages/Generic' }
  deviation.evaluated:
    publish:
      operationId: on-deviation-evaluated
      message: { $ref: '#/components/messages/Generic' }
  gmp.evaluated:
    publish:
      operationId: on-gmp-evaluated
      message: { $ref: '#/components/messages/Generic' }
components:
  messages:
    Generic: { payload: { $ref: '#/components/schemas/CloudEvent' } }
  schemas:
    CloudEvent:
      type: object
      required: [specversion, id, source, type, time]
      properties:
        specversion: { type: string, enum: ['1.0'] }
        id: { type: string, format: uuid }
        source: { type: string, example: '/open-pharmaceutical/service' }
        type: { type: string, example: 'context.event' }
        subject: { type: string, description: Aggregate id (ordering key). }
        time: { type: string, format: date-time }
        datacontenttype: { type: string, enum: [application/json] }
        data: { type: object }
